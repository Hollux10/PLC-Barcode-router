name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix ownership & permissions inside container
        run: |
          git config --global --add safe.directory /__w/PLC-Barcode-router/PLC-Barcode-router

      - name: Build APK with Buildozer as non-root user
        run: |
          useradd -m -s /bin/bash builduser || true
          chown -R builduser:builduser .
          su - builduser -c "export PATH=\$PATH:/usr/local/bin:~/.local/bin; cd $(pwd) && buildozer -v android debug"





      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLC_Barcode_Router_APK
          path: bin/*.apk



