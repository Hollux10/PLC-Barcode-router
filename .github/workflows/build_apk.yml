name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: Install System Dependencies & Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libssl-dev libffi-dev libsqlite3-dev build-essential
          pip install --upgrade buildozer cython
          
          # Install specific build-tools containing aidl and accept licenses
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;33.0.1" "platforms;android-33" "platform-tools"
          
          # Export build-tools directory containing aidl to PATH
          echo "${ANDROID_HOME}/build-tools/33.0.1" >> $GITHUB_PATH
          echo "PATH=${ANDROID_HOME}/build-tools/33.0.1:$PATH" >> $GITHUB_ENV

      - name: Build APK with Buildozer
        run: |
          export PATH="${ANDROID_HOME}/build-tools/33.0.1:$PATH"
          buildozer -v android debug



      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLC_Barcode_Router_APK
          path: bin/*.apk

