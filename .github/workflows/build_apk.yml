name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libssl-dev libffi-dev libsqlite3-dev build-essential aidl
          pip install --upgrade buildozer cython

      - name: Build APK with Buildozer
        run: |
          # Buildozer automatically downloads and configures Android SDK/NDK inside ~/.buildozer
          buildozer -v android debug




      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLC_Barcode_Router_APK
          path: bin/*.apk

