name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            automake libltdl-dev \
            zlib1g-dev libncurses5-dev libncursesw5-dev libssl-dev \
            libffi-dev libsqlite3-dev build-essential

      - name: Install Python build dependencies
        run: |
          pip install --upgrade pip
          pip install 'cython<3.0.0' buildozer

      - name: Set up Android SDK build-tools & legacy sdkmanager path
        run: |
          # Install build-tools with aidl into system SDK
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;33.0.1" "platforms;android-33" "platform-tools"

          # Buildozer/p4a might look for tools/bin/sdkmanager (legacy path)
          # We use a wrapper script instead of symlink to avoid Java classpath issues
          mkdir -p $ANDROID_HOME/tools/bin
          cat << 'EOF' > $ANDROID_HOME/tools/bin/sdkmanager
          #!/bin/bash
          exec $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "$@"
          EOF
          chmod +x $ANDROID_HOME/tools/bin/sdkmanager

      - name: Build APK with Buildozer
        run: |
          export PATH="$ANDROID_HOME/build-tools/33.0.1:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLC_Barcode_Router_APK
          path: bin/*.apk
