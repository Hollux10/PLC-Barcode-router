<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLC Communications Log</title>
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=10">
</head>
<body class="logs-body">
    <div class="background">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
    </div>

    <div class="logs-page">
        <div class="panel console">
            <div class="panel-header">
                <h2>PLC Communications Log</h2>
                <div class="pulse-indicator"></div>
            </div>
            <div class="terminal" id="terminal">
                <div class="log-entry log-info"><span class="log-msg">Waiting for PLC connections...</span></div>
            </div>
        </div>
    </div>
    <script src="/static/logs.js?v=10"></script>
</body>
</html>
